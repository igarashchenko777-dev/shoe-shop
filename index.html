<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Взуття & StepStyle</title>
    <!-- Підключаємо Tailwind CSS для гарного та адаптивного дизайну -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Приховуємо скроллбар для категорій, щоб на мобільних це виглядало як акуратна стрічка */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Шапка сайту -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-orange-600 tracking-wider">STEP_STYLE</h1>
            <!-- Кнопка кошика -->
            <button onclick="toggleCart()" class="relative bg-orange-500 text-white px-5 py-2.5 rounded-full font-semibold hover:bg-orange-600 transition shadow-md shadow-orange-500/20 cursor-pointer">
                🛒 Кошик <span id="cart-count" class="bg-white text-orange-600 text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- Блок категорій (Адаптивний горизонтальний скролл для смартфонів) -->
        <section class="mb-8">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Категорії взуття</h2>
            <div id="categories-list" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <!-- Категорії генеруються через JavaScript -->
            </div>
        </section>

        <!-- Сітка товарів -->
        <section>
            <h2 class="text-xl font-bold text-gray-900 mb-6">Каталог товарів</h2>
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Товари генеруються через JavaScript -->
            </div>
        </section>
    </main>

    <!-- Модальне вікно кошика та оформлення замовлення -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-3xl cursor-pointer">&times;</button>
            
            <h2 class="text-xl font-bold text-gray-950 mb-4 flex items-center gap-2">🛒 Ваше замовлення</h2>
            
            <!-- Товари в кошику -->
            <div id="cart-items" class="space-y-3 mb-6 max-h-40 overflow-y-auto pr-1">
                <!-- Сюди додаватимуться товари -->
            </div>

            <div class="border-t border-gray-100 pt-4 mb-6">
                <div class="flex justify-between font-black text-lg text-gray-900">
                    <span>Всього до сплати:</span>
                    <span id="cart-total">0 грн</span>
                </div>
            </div>

            <!-- Форма оформлення замовлення -->
            <form id="order-form" onsubmit="submitOrder(event)" class="space-y-4">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100 pb-2">Дані для доставки</h3>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Ім'я та Прізвище</label>
                    <input type="text" id="client-name" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Телефон</label>
                    <input type="tel" id="client-phone" placeholder="+380" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Служба доставки</label>
                    <select id="delivery-service" class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                        <option value="Нова Пошта">Нова Пошта</option>
                        <option value="Укрпошта">Укрпошта</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Місто та номер відділення</label>
                    <input type="text" id="delivery-address" placeholder="Наприклад: Київ, Відділення №15" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500">
                </div>

                <button type="submit" class="w-full bg-orange-500 text-white py-3.5 rounded-xl font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-500/20 mt-2 cursor-pointer">
                    Підтвердити замовлення
                </button>
            </form>
        </div>
    </div>

    <!-- Логіка роботи магазину (JavaScript) -->
    <script>
        // НАЛАШТУВАННЯ ТЕЛЕГРАМ (Заміни на свої дані)
        const TELEGRAM_BOT_TOKEN = 'ТВІЙ_ТОКЕН_БОТА'; 
        const TELEGRAM_CHAT_ID = 'ТВІЙ_ID_КАНАЛУ_АБО_ЧАТУ'; // Наприклад: '-100123456789'

        // Масив категорій згідно з твоїм списком
        const categories = [
            { id: 'all', name: 'Все взуття' },
            { id: 'news', name: 'Новинки' },
            { id: 'sneakers', name: 'Кросівки' },
            { id: 'keds', name: 'Кеди' },
            { id: 'shoes', name: 'Туфлі' },
            { id: 'slippers', name: 'Шльопанці' },
            { id: 'loafers', name: 'Лофери' },
            { id: 'sandals', name: 'Сандалі' },
            { id: 'boots', name: 'Черевики' }
        ];

        // Демонстраційна база даних товарів
        const products = [
            { id: 1, name: "Білі Шкіряні Кросівки", category: "sneakers", price: 2450, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
            { id: 2, name: "Класичні Чорні Лофери", category: "loafers", price: 3100, image: "https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=500" },
            { id: 3, name: "Літні Стильні Сандалі", category: "sandals", price: 1650, image: "https://images.unsplash.com/photo-1603487742131-4160ec999306?w=500" },
            { id: 4, name: "Осінні Шкіряні Черевики", category: "boots", price: 3800, image: "https://images.unsplash.com/photo-1520639888713-7851133b1ed0?w=500" },
            { id: 5, name: "Кросівки Run Fast (Новинка)", category: "news", price: 2900, image: "https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500" },
            { id: 6, name: "Стильні Кеди Casual", category: "keds", price: 1800, image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500" }
        ];

        let cart = [];
        let currentCategory = 'all';

        // Генерація кнопок категорій
        function renderCategories() {
            const container = document.getElementById('categories-list');
            container.innerHTML = '';
            
            categories.forEach(cat => {
                const isActive = cat.id === currentCategory;
                const activeClass = isActive ? 'bg-orange-600 text-white shadow-md shadow-orange-600/20' : 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-50';
                
                container.innerHTML += `
                    <button onclick="filterCategory('${cat.id}')" class="${activeClass} px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition cursor-pointer">
                        ${cat.name}
                    </button>
                `;
            });
        }

        // Відображення товарів
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8">У цій категорії поки немає товарів.</p>`;
                return;
            }

            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 flex flex-col justify-between hover:shadow-md transition duration-300">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-56 object-cover">
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-900 text-base mb-1">${product.name}</h3>
                                <p class="text-gray-400 text-xs mb-4 uppercase font-semibold">${categories.find(c => c.id === product.category).name}</p>
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-lg font-black text-gray-950">${product.price} грн</span>
                                <button onclick="addToCart(${product.id})" class="bg-gray-900 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-orange-500 transition cursor-pointer">
                                    Купити
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Перемикання категорій
        function filterCategory(catId) {
            currentCategory = catId;
            renderCategories();
            renderProducts();
        }

        // Управління кошиком
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                        <div>
                            <p class="font-bold text-xs text-gray-900">${item.name}</p>
                            <p class="text-orange-600 text-xs font-semibold">${item.price} грн</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 text-xs font-bold hover:text-red-700 cursor-pointer">Видалити</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = `${total} грн`;
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        // Надсилання замовлення в Telegram
        async function submitOrder(event) {
            event.preventDefault();
            
            if(cart.length === 0) {
                alert('Ваш кошик порожній!');
                return;
            }

            // Збираємо дані з форми
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const service = document.getElementById('delivery-service').value;
            const address = document.getElementById('delivery-address').value;
            const totalSum = document.getElementById('cart-total').innerText;

            // Формуємо список товарів для повідомлення
            let itemsText = '';
            cart.forEach((item, i) => {
                itemsText += `${i + 1}. ${item.name} — ${item.price} грн\n`;
            });

            // Формуємо красивий текст повідомлення
            const message = `🛍️ **НОВЕ ЗАМОВЛЕННЯ** 🛍️\n\n` +
                            `👤 **Клієнт:** ${name}\n` +
                            `📞 **Телефон:** ${phone}\n` +
                            `🚚 **Доставка:** ${service}\n` +
                            `📍 **Адреса:** ${address}\n\n` +
                            `📦 **Товари:**\n${itemsText}\n` +
                            `💰 **Разом до сплати:** ${totalSum}`;

            // Якщо токени не налаштовані, показуємо демо-режим
            if (TELEGRAM_BOT_TOKEN === 'ТВІЙ_ТОКЕН_БОТА') {
                alert(`Демо-режим!\nЗамовлення сформовано успішно, але Telegram бот не налаштований.\n\nПовідомлення, яке мало піти:\n${message}`);
                finishOrder();
                return;
            }

            // Запит до Telegram API
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    alert('Дякуємо! Ваше замовлення прийнято і відправлено менеджеру в Telegram.');
                    finishOrder();
                } else {
                    alert('Помилка відправки замовлення через Telegram. Перевірте налаштування ID чату та Токену.');
                }
            } catch (error) {
                console.error(error);
                alert('Сталася помилка з\'єднання з сервером Telegram.');
            }
        }

        function finishOrder() {
            cart = [];
            updateCart();
            document.getElementById('order-form').reset();
            toggleCart();
        }

        // Ініціалізація сторінки при завантаженні
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
